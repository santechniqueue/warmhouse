services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=devices
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  devices-app:
    build:
      context: ./mvp/devices-management
      dockerfile: Dockerfile
    container_name: devices-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - HTTP_PORT=:8082
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

  devices-consumer:
    build:
      context: ./mvp/devices-consumer
      dockerfile: Dockerfile
    container_name: devices-consumer
    depends_on:
      postgres:
        condition: service_healthy
      devices-app:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - KAFKA_BROKERS=kafka:9092
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-streamer:
    build: ./mvp/telemetry-streamer
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=telemetry
      - POLL_INTERVAL_SEC=60
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-consumer:
      build: ./mvp/telemetry-consumer
      environment:
        - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
        - KAFKA_BROKERS=kafka:9092
        - KAFKA_TOPIC=telemetry
      depends_on:
        postgres:
          condition: service_healthy
        kafka:
          condition: service_healthy
        telemetry-streamer:
          condition: service_started
      restart: unless-stopped
      networks:
        - smarthome-network

  telemetry-api:
    build: ./mvp/telemetry-api
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8083:8083"
    networks:
      - smarthome-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true   # авто-создание при первом обращении
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smarthome-network

  kafka-create-topic:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-lc" ]
    command: >
      "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic devices --replication-factor 1 --partitions 1"
    restart: no
    networks:
      - smarthome-network

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8084:8080"
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge